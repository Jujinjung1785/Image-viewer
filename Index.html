<script>
/* ===== multiview.js ===== */
/*
 * 다중 화면 동기화 보기
 *
 * - 화면을 원하는 개수(1~16)로 나누고, 화면마다 시리즈를 골라 봅니다.
 * - 위치 동기화: DICOM의 3차원 위치 정보(Image Position/Orientation)로
 *   같은 방향 시리즈는 같은 위치의 슬라이스로 따라 움직입니다.
 * - 기준선: 다른 화면이 보고 있는 단면이 이 화면의 어디를 지나는지 색깔 선으로 표시합니다.
 * - 클릭: 그 지점을 다른 화면들에서 찾아 이동하고 십자 표시를 합니다.
 * - 위치 정보가 없는 그림(JPG 등)은 같은 순번끼리 동기화합니다.
 */
(function () {
  'use strict';

  const COLORS = ['#ffcc33', '#4fc3f7', '#81c784', '#f06292', '#ba68c8', '#ff8a65', '#4dd0e1', '#aed581',
                  '#e57373', '#9575cd', '#fff176', '#90a4ae', '#f48fb1', '#80cbc4', '#ffb74d', '#7986cb'];
  const MAX_VP = 16;
  const HEADER_BYTES = 128 * 1024;

  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
  const clampN = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  const store = {
    get(k, d) { try { const v = localStorage.getItem('iv.mv.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('iv.mv.' + k, JSON.stringify(v)); } catch {} },
  };

  const opts = { sync: true, lines: true, zoomSync: false, wlSync: false, ...store.get('opts', {}) };
  let count = clampN(store.get('count', 2) | 0 || 2, 1, MAX_VP);

  let core = null, root = null, grid = null, statusEl = null, countEl = null;
  let series = [], vps = [], active = null, cursor = null, entriesRef = null, buildToken = 0;
  let closed = [];      // 닫은 화면 (보던 상태 그대로 보관 → 다시 열기 가능)
  let reopenEl = null;

  // ---------- 위치 계산 ----------
  // 픽셀 (열 x, 행 y) → 환자 좌표(mm)
  function pixelTo3D(g, x, y) {
    return add(g.ipp, add(mul(g.row, x * g.ps[1]), mul(g.col, y * g.ps[0])));
  }
  function toPixel(g, X) {
    const v = sub(X, g.ipp);
    return [dot(v, g.row) / g.ps[1], dot(v, g.col) / g.ps[0]];
  }
  // 대상 영상(g, rows×cols) 위에 다른 단면(src)이 지나가는 선분 (픽셀 좌표)
  function planeSegment(g, rows, cols, src) {
    if (Math.abs(dot(g.normal, src.normal)) > 0.995) return null; // 평행하면 선 없음
    const c = [[-0.5, -0.5], [cols - 0.5, -0.5], [cols - 0.5, rows - 0.5], [-0.5, rows - 0.5]];
    const d = c.map(([x, y]) => dot(sub(pixelTo3D(g, x, y), src.ipp), src.normal));
    const pts = [];
    for (let i = 0; i < 4; i++) {
      const j = (i + 1) % 4;
      if (d[i] === 0) pts.push(c[i]);
      else if (d[i] * d[j] < 0) {
        const t = d[i] / (d[i] - d[j]);
        pts.push([c[i][0] + (c[j][0] - c[i][0]) * t, c[i][1] + (c[j][1] - c[i][1]) * t]);
      }
    }
    return pts.length >= 2 ? [pts[0], pts[1]] : null;
  }
  const sameSpace = (a, b) => !!a && !!b && ((a.frameOfRef && a.frameOfRef === b.frameOfRef) ||
    ((!a.frameOfRef || !b.frameOfRef) && a.study && a.study === b.study));
  function orientationName(n) {
    const a = n.map(Math.abs), i = a.indexOf(Math.max(...a));
    return ['시상면', '관상면', '축상면'][i];
  }
  // 점 X를 가장 잘 보여 주는 슬라이스
  // normal을 주면 그 방향과 평행한 슬라이스 중에서만 찾음 (없으면 null)
  function nearestSlice(ser, X, normal) {
    let best = -1, bd = Infinity;
    ser.slices.forEach((s, i) => {
      if (!s.geom) return;
      if (normal && Math.abs(dot(s.geom.normal, normal)) < 0.95) return;
      let dd = Math.abs(dot(sub(X, s.geom.ipp), s.geom.normal));
      const [px, py] = toPixel(s.geom, X);
      // 점이 그 영상 범위 밖이면 후순위 (각도가 다른 묶음 중 엉뚱한 장을 고르지 않도록)
      if (px < -0.5 || py < -0.5 || px > s.cols - 0.5 || py > s.rows - 0.5) dd += 1e6;
      if (dd < bd) { bd = dd; best = i; }
    });
    return best < 0 ? null : best;
  }

  // ---------- 시리즈 만들기 ----------
  async function pool(items, n, fn) {
    let i = 0;
    await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => {
      while (i < items.length) { const k = i++; await fn(items[k]); }
    }));
  }

  async function readHeader(entry) {
    let buf = await (await core.readBlob(entry, HEADER_BYTES)).arrayBuffer();
    let info = null;
    try { info = await core.parseDicom(buf); } catch { /* 앞부분만으로 부족하면 전체를 읽음 */ }
    if ((!info || !info.rows) && entry.size > HEADER_BYTES) {
      buf = await (await core.readBlob(entry)).arrayBuffer();
      info = await core.parseDicom(buf);
    }
    return info;
  }

  async function buildSeries(entries, progress) {
    const dicom = entries.filter((e) => e.kind.decoder === 'dicom');
    const plain = entries.filter((e) => !e.kind.unsupported && e.kind.decoder !== 'dicom');
    const groups = new Map();
    let done = 0;
    await pool(dicom, 6, async (e) => {
      let info = null;
      try { info = await readHeader(e); } catch { /* 읽을 수 없는 파일은 건너뜀 */ }
      progress(++done, dicom.length);
      if (!info || info.noPixel || !info.rows) return;
      const g = info.geom;
      // 시리즈 고유번호(Series Instance UID)로만 묶음.
      // (척추 MRI 축상면처럼 디스크마다 각도를 달리 찍은 묶음도 한 시리즈로 유지)
      let key = info.ids.series || 'dir:' + e.path.replace(/[^/]*$/, '');
      if (info.frames > 1) key += '|' + e.path;
      if (!groups.has(key)) {
        groups.set(key, {
          title: info.meta.seriesDescription || info.meta.modality || 'DICOM', modality: info.meta.modality,
          seriesNumber: info.ids.seriesNumber, ori: '',
          space: { frameOfRef: info.ids.frameOfRef, study: info.ids.study }, slices: [],
        });
      }
      const grp = groups.get(key);
      const base = { entry: e, rows: info.rows, cols: info.cols, ps: info.ps, inst: parseInt(info.meta.instanceNumber, 10) || 0,
        unsupported: info.unsupported || null, space: grp.space };
      if (info.frames > 1) for (let f = 0; f < info.frames; f++) grp.slices.push({ ...base, frame: f, geom: null, center: null, inst: f });
      else grp.slices.push({ ...base, frame: 0, geom: g, center: g ? pixelTo3D(g, (info.cols - 1) / 2, (info.rows - 1) / 2) : null });
    });

    const out = [];
    for (const grp of groups.values()) {
      const allGeom = grp.slices.every((s) => s.geom);
      const byInst = (a, b) => a.inst - b.inst || core.collator.compare(a.entry.path, b.entry.path);
      if (allGeom) {
        // 평균 방향을 구해서, 모두 비슷한 방향이면 위치 순서로 정렬
        const n0 = grp.slices[0].geom.normal;
        let m = [0, 0, 0];
        for (const s of grp.slices) m = add(m, mul(s.geom.normal, dot(s.geom.normal, n0) < 0 ? -1 : 1));
        const len = Math.hypot(m[0], m[1], m[2]) || 1;
        m = mul(m, 1 / len);
        const oneDirection = grp.slices.every((s) => Math.abs(dot(s.geom.normal, m)) > 0.9);
        if (oneDirection) {
          grp.slices.sort((a, b) => dot(a.center, m) - dot(b.center, m) || byInst(a, b));
          grp.ori = orientationName(m);
          grp.axis = m;
        } else {
          grp.slices.sort(byInst);   // localizer처럼 여러 방향이 섞인 시리즈는 촬영 순서
          grp.ori = '여러 방향';
          grp.axis = null;
        }
      } else grp.slices.sort(byInst);
      grp.geom = allGeom;
      out.push(grp);
    }
    out.sort((a, b) => a.seriesNumber - b.seriesNumber || core.collator.compare(a.title, b.title));

    // 일반 그림은 폴더별로 하나의 시리즈
    const byDir = new Map();
    for (const e of plain) {
      const dir = e.path.includes('/') ? e.path.replace(/\/[^/]*$/, '') : '';
      if (!byDir.has(dir)) byDir.set(dir, []);
      byDir.get(dir).push(e);
    }
    for (const [dir, list] of byDir) {
      list.sort((a, b) => core.collator.compare(a.path, b.path));
      out.push({ title: dir ? dir.split('/').pop() : '그림', seriesNumber: 0, ori: '', geom: false, space: null,
        slices: list.map((e) => ({ entry: e, frame: 0, geom: null, rows: 0, cols: 0, ps: [1, 1], space: null })) });
    }
    out.forEach((s) => {
      s.label = `${s.seriesNumber ? s.seriesNumber + '. ' : ''}${s.title}${s.ori ? ' · ' + s.ori : ''} (${s.slices.length}장)`;
    });
    return out;
  }

  // ---------- 영상 읽기 (최근 것만 메모리에 유지) ----------
  const frameCache = new Map();
  const infoCache = new Map();
  const FRAME_MAX = 80, INFO_MAX = 4;

  function lru(map, key, make, max) {
    if (map.has(key)) { const v = map.get(key); map.delete(key); map.set(key, v); return v; }
    const p = make();
    p.catch(() => map.delete(key));
    map.set(key, p);
    while (map.size > max) map.delete(map.keys().next().value);
    return p;
  }

  function loadSlice(s) {
    return lru(frameCache, s.entry.path + '#' + s.frame, async () => {
      if (s.unsupported) throw new Error(s.unsupported);
      if (s.entry.kind.decoder === 'dicom') {
        const info = await lru(infoCache, s.entry.path, async () => core.parseDicom(await (await core.readBlob(s.entry)).arrayBuffer()), INFO_MAX);
        const fr = await window.DicomDecoder.decodeFrame(info, s.frame);
        return { fr, rows: info.rows, cols: info.cols };
      }
      const blob = await core.displayBlob(s.entry);
      const url = URL.createObjectURL(blob);
      try {
        const img = new Image();
        img.src = url;
        await img.decode();
        return { src: img, rows: img.naturalHeight, cols: img.naturalWidth };
      } finally { URL.revokeObjectURL(url); }
    }, FRAME_MAX);
  }

  // ---------- 화면 구성 ----------
  function ensureUI() {
    if (root) return;
    root = document.getElementById('multi');
    root.innerHTML = `
      <div class="mv-bar">
        <label>화면 수 <input id="mvCount" type="number" min="1" max="${MAX_VP}"></label>
        <button data-opt="sync" title="같은 방향 시리즈를 같은 위치로 함께 움직임">위치 동기화</button>
        <button data-opt="lines" title="다른 화면이 보고 있는 단면 위치를 색깔 선으로 표시">기준선</button>
        <button data-opt="zoomSync" title="한 화면의 확대 배율을 모든 화면에 적용">확대 동기화</button>
        <button data-opt="wlSync" title="한 화면의 밝기/대비를 모든 화면에 적용">W/L 동기화</button>
        <button id="mvClear" title="클릭해서 찍은 위치 표시를 지움 (C)">표시점 지우기</button>
        <select id="mvReopen" title="닫은 화면을 보던 상태 그대로 다시 엽니다" hidden></select>
        <span id="mvStatus"></span>
        <span class="mv-help">휠: 슬라이스 · Ctrl+휠: 확대 · 드래그: 이동 · 오른쪽 드래그: W/L · 클릭: 그 위치를 다른 화면에서 찾기 · 더블클릭: 맞춤</span>
      </div>
      <div id="mvGrid"></div>`;
    grid = root.querySelector('#mvGrid');
    statusEl = root.querySelector('#mvStatus');
    countEl = root.querySelector('#mvCount');
    countEl.value = count;
    countEl.addEventListener('change', () => {
      count = clampN(parseInt(countEl.value, 10) || 1, 1, MAX_VP);
      countEl.value = count;
      store.set('count', count);
      layout();
    });
    countEl.addEventListener('keydown', (e) => e.stopPropagation());
    root.querySelectorAll('[data-opt]').forEach((b) => {
      b.addEventListener('click', () => {
        opts[b.dataset.opt] = !opts[b.dataset.opt];
        store.set('opts', opts);
        syncButtons();
        if (b.dataset.opt === 'sync' && opts.sync && active) syncFrom(active);
        drawAll();
      });
    });
    root.querySelector('#mvClear').addEventListener('click', clearCursor);
    reopenEl = root.querySelector('#mvReopen');
    reopenEl.addEventListener('change', () => {
      const vp = closed[parseInt(reopenEl.value, 10)];
      reopenEl.value = '';
      if (vp) reopenViewport(vp);
    });
    reopenEl.addEventListener('keydown', (e) => e.stopPropagation());
    syncButtons();
    new ResizeObserver(() => drawAll()).observe(grid);
    document.addEventListener('keydown', onKey);
  }

  function syncButtons() {
    root.querySelectorAll('[data-opt]').forEach((b) => b.classList.toggle('active', !!opts[b.dataset.opt]));
  }
  const status = (t) => { if (statusEl) statusEl.textContent = t; };

  function makeViewport(i) {
    const el = document.createElement('div');
    el.className = 'vp';
    // 아직 안 쓰는 색 (화면을 닫았다가 다시 늘려도 색이 겹치지 않게)
    const color = COLORS.find((c) => !vps.some((v) => v.color === c) && !closed.some((v) => v.color === c)) ||
      COLORS.find((c) => !vps.some((v) => v.color === c)) || COLORS[i % COLORS.length];
    el.style.setProperty('--vp-color', color);
    el.innerHTML = '<div class="vp-head"><span class="vp-dot"></span><select></select><span class="vp-slice"></span>' +
      '<button class="vp-close" title="이 화면 닫기">×</button></div>' +
      '<div class="vp-body"><canvas></canvas><div class="vp-info"></div><div class="vp-msg"></div></div>';
    const vp = {
      i, el, color,
      select: el.querySelector('select'), sliceEl: el.querySelector('.vp-slice'),
      body: el.querySelector('.vp-body'), canvas: el.querySelector('canvas'),
      infoEl: el.querySelector('.vp-info'), msgEl: el.querySelector('.vp-msg'),
      seriesIdx: -1, sliceIdx: 0, zoom: 1, panX: 0, panY: 0, wl: null,
      data: null, off: null, xf: null, token: 0, wheelAcc: 0,
    };
    vp.select.addEventListener('change', () => {
      vp.seriesIdx = parseInt(vp.select.value, 10);
      const ser = series[vp.seriesIdx];
      vp.sliceIdx = ser ? Math.floor(ser.slices.length / 2) : 0;
      vp.panX = vp.panY = 0; vp.wl = null; vp.data = null;
      setActive(vp);
      if (core.edit) core.edit.targetChanged();
      if (opts.sync) syncTo(vp); // 새 시리즈를 지금 위치에 맞춤
      showSlice(vp);
      drawAll();
    });
    vp.select.addEventListener('keydown', (e) => e.stopPropagation());
    el.querySelector('.vp-close').addEventListener('click', () => closeViewport(vp));
    bindPointer(vp);
    return vp;
  }

  // 화면 하나 닫기: 나머지 화면은 보던 그대로 유지, 닫은 화면은 보관
  function closeViewport(vp) {
    if (vps.length <= 1) return;
    detach(vp);
    afterCountChange();
  }
  function detach(vp) {
    vps.splice(vps.indexOf(vp), 1);
    vp.token++;
    vp.el.remove();
    closed.push(vp);
    if (active === vp) setActive(vps[0] || null);
  }

  // 닫은 화면 다시 열기: 시리즈·위치·확대·W/L 그대로
  function reopenViewport(vp) {
    if (vps.length >= MAX_VP) return;
    closed.splice(closed.indexOf(vp), 1);
    attach(vp);
    afterCountChange();
  }
  function attach(vp) {
    vps.push(vp);
    grid.append(vp.el);
    fillSelect(vp);
    setActive(vp);
    if (opts.sync && cursor) syncTo(vp); // 표시점이 있으면 그 위치로 맞춤
    showSlice(vp);
  }

  function afterCountChange() {
    count = vps.length;
    if (countEl) countEl.value = count;
    store.set('count', count);
    updateGrid();
    refreshReopen();
    requestAnimationFrame(drawAll); // 닫은 화면의 기준선은 사라지고, 다시 연 화면의 기준선은 나타남
  }

  function refreshReopen() {
    if (!reopenEl) return;
    reopenEl.replaceChildren(new Option(`닫은 화면 다시 열기 (${closed.length})`, ''));
    closed.forEach((vp, i) => {
      const ser = series[vp.seriesIdx];
      const o = new Option(`■ ${ser ? ser.label : '빈 화면'}${ser ? ` — ${vp.sliceIdx + 1}번째` : ''}`, String(i));
      o.style.color = vp.color;
      reopenEl.append(o);
    });
    reopenEl.hidden = closed.length === 0;
  }

  function updateGrid() {
    const cols = count <= 3 ? count : Math.ceil(Math.sqrt(count));
    grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
    grid.style.gridTemplateRows = `repeat(${Math.ceil(count / cols)}, minmax(0, 1fr))`;
    grid.classList.toggle('single', count === 1);
  }

  function fillSelect(vp) {
    vp.select.replaceChildren();
    if (!series.length) { vp.select.append(new Option('영상 없음', '-1')); return; }
    series.forEach((s, i) => vp.select.append(new Option(s.label, String(i))));
    vp.select.value = String(vp.seriesIdx);
  }

  function layout() {
    // 화면 수를 줄이면 뒤쪽 화면을 닫아 보관, 늘리면 닫아 둔 화면부터 다시 엶
    while (vps.length > count) detach(vps[vps.length - 1]);
    while (vps.length < count && closed.length) { attach(closed.pop()); }
    while (vps.length < count) {
      const vp = makeViewport(vps.length);
      vps.push(vp);
      grid.append(vp.el);
      if (series.length) { assignDefault(vp); if (opts.sync) syncTo(vp); }
    }
    updateGrid();
    refreshReopen();
    vps.forEach(fillSelect);
    if (!active && vps.length) setActive(vps[0]);
    vps.forEach((vp) => { if (!vp.data && series[vp.seriesIdx]) showSlice(vp); });
    requestAnimationFrame(drawAll);
  }

  // 기본 배정: 화면마다 서로 다른 시리즈 (가능하면 서로 다른 방향 먼저)
  function assignDefault(vp) {
    const used = new Set(vps.filter((v) => v !== vp && v.seriesIdx >= 0).map((v) => v.seriesIdx));
    const usedOri = new Set([...used].map((i) => series[i] && series[i].ori));
    let pick = series.findIndex((s, i) => !used.has(i) && s.ori && !usedOri.has(s.ori));
    if (pick < 0) pick = series.findIndex((s, i) => !used.has(i));
    if (pick < 0) pick = vp.i % series.length;
    vp.seriesIdx = pick;
    vp.sliceIdx = Math.floor(series[pick].slices.length / 2);
    vp.zoom = 1; vp.panX = vp.panY = 0; vp.wl = null; vp.data = null;
  }

  function setActive(vp) {
    const changed = active !== vp;
    active = vp;
    vps.forEach((v) => v.el.classList.toggle('active', v === vp));
    if (changed && core && core.edit) { core.edit.targetChanged(); drawAll(); }   // 편집 대상 창이 바뀜
  }

  // ---------- 슬라이스 표시 ----------
  const currentSlice = (vp) => { const ser = series[vp.seriesIdx]; return ser ? ser.slices[clampN(vp.sliceIdx, 0, ser.slices.length - 1)] : null; };

  async function showSlice(vp) {
    const ser = series[vp.seriesIdx];
    if (!ser) { vp.data = null; draw(vp); return; }
    vp.sliceIdx = clampN(vp.sliceIdx, 0, ser.slices.length - 1);
    const s = ser.slices[vp.sliceIdx];
    const token = ++vp.token;
    updateHead(vp);
    try {
      const data = await loadSlice(s);
      if (token !== vp.token) return;
      vp.data = data;
      vp.msgEl.textContent = '';
      paintOff(vp);
    } catch (err) {
      if (token !== vp.token) return;
      vp.data = null;
      vp.msgEl.textContent = err.message;
    }
    draw(vp);
    // 앞뒤 슬라이스 미리 읽기 (빠르게 넘기기용)
    for (const d of [1, -1, 2]) { const n = ser.slices[vp.sliceIdx + d]; if (n) loadSlice(n).catch(() => {}); }
  }

  function updateHead(vp) {
    const ser = series[vp.seriesIdx], s = currentSlice(vp);
    vp.sliceEl.textContent = ser ? `${vp.sliceIdx + 1} / ${ser.slices.length}` : '';
    if (s && s.geom) {
      const n = series[vp.seriesIdx].axis || s.geom.normal;
      vp.sliceEl.textContent += ` · ${dot(s.center, n).toFixed(1)}mm`;
    }
  }

  function paintOff(vp) {
    const d = vp.data;
    if (!d || !d.fr) { vp.off = null; return; }
    if (!vp.off) vp.off = document.createElement('canvas');
    const off = vp.off;
    if (off.width !== d.cols || off.height !== d.rows) { off.width = d.cols; off.height = d.rows; vp.offImg = null; }
    const g = off.getContext('2d');
    if (!vp.offImg) vp.offImg = g.createImageData(d.cols, d.rows);
    if (d.fr.kind === 'gray') {
      const wl = vp.wl || d.fr.defaultWL;
      window.DicomDecoder.renderGray(d.fr, wl.c, wl.w, vp.offImg.data);
    } else vp.offImg.data.set(d.fr.rgba);
    g.putImageData(vp.offImg, 0, 0);
    off._ver = Math.random();   // 편집 결과를 다시 만들어야 함을 표시
  }

  function draw(vp) {
    const c = vp.canvas, dpr = window.devicePixelRatio || 1;
    const W = Math.max(1, Math.round(c.clientWidth * dpr)), H = Math.max(1, Math.round(c.clientHeight * dpr));
    if (c.width !== W) c.width = W;
    if (c.height !== H) c.height = H;
    const g = c.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = '#000';
    g.fillRect(0, 0, W, H);
    const s = currentSlice(vp), d = vp.data;
    updateHead(vp);
    if (!s || !d) { vp.xf = null; vp.infoEl.textContent = ''; return; }

    const ps = s.geom ? s.geom.ps : s.ps || [1, 1];
    g.imageSmoothingEnabled = !core.pixelated();
    let src = vp.off || d.src, cw = d.cols, ch = d.rows, transformed = false;
    // 편집 내용(지운 영역·도형·글자·회전·직사각형 펴기)이 있으면 그 결과를 보여 줌
    if (core.edit) {
      if (!vp.ecomp) vp.ecomp = document.createElement('canvas');
      const est = Math.min(W / (d.cols * ps[1]), H / (d.rows * ps[0])) * 0.98 * vp.zoom * ps[1];
      const res = core.edit.paint(vp.ecomp, src, d.cols, d.rows, s.entry, s.frame, vp === active, est);
      if (res) { src = vp.ecomp; cw = res.w; ch = res.h; transformed = res.transformed; }
    }
    const mmW = cw * ps[1], mmH = ch * ps[0];
    const k = Math.min(W / mmW, H / mmH) * 0.98 * vp.zoom;
    const dw = mmW * k, dh = mmH * k;
    const dx = (W - dw) / 2 + vp.panX * dpr, dy = (H - dh) / 2 + vp.panY * dpr;
    g.drawImage(src, dx, dy, dw, dh);
    // 회전·펴기를 한 그림은 원래 위치 정보와 맞지 않으므로 그 창에는 기준선·위치 표시를 그리지 않음
    const xf = vp.xf = { dx, dy, px: dw / cw, py: dh / ch, dpr, transformed };
    const toScreen = ([x, y]) => [xf.dx + (x + 0.5) * xf.px, xf.dy + (y + 0.5) * xf.py];

    // 기준선: 다른 화면들이 보고 있는 단면 위치
    if (opts.lines && s.geom && !transformed) {
      g.lineWidth = Math.max(1, 1.5 * dpr);
      for (const o of vps) {
        if (o === vp) continue;
        const os = currentSlice(o);
        if (!os || !os.geom || !sameSpace(os.space, s.space)) continue;
        const seg = planeSegment(s.geom, d.rows, d.cols, os.geom);
        if (!seg) continue;
        const [a, b] = seg.map(toScreen);
        g.strokeStyle = o.color;
        g.setLineDash(o === active ? [] : [6 * dpr, 4 * dpr]);
        g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
      }
      g.setLineDash([]);
    }
    // 클릭한 위치 표시 (십자)
    if (cursor && s.geom && !transformed && sameSpace(cursor.space, s.space)) {
      const [sx, sy] = toScreen(toPixel(s.geom, cursor.X));
      const r = 10 * dpr, gap = 4 * dpr;
      g.lineWidth = 2 * dpr;
      for (const [col, w] of [['rgba(0,0,0,.7)', 4 * dpr], ['#ffffff', 1.5 * dpr]]) {
        g.strokeStyle = col; g.lineWidth = w;
        g.beginPath();
        g.moveTo(sx - r, sy); g.lineTo(sx - gap, sy); g.moveTo(sx + gap, sy); g.lineTo(sx + r, sy);
        g.moveTo(sx, sy - r); g.lineTo(sx, sy - gap); g.moveTo(sx, sy + gap); g.lineTo(sx, sy + r);
        g.stroke();
      }
    }
    const parts = [`${Math.round((xf.px / dpr) * 100)}%`];
    if (d.fr && d.fr.kind === 'gray') { const wl = vp.wl || d.fr.defaultWL; parts.push(`W/L ${Math.round(wl.w)}/${Math.round(wl.c)}`); }
    vp.infoEl.textContent = parts.join(' · ');
  }

  function drawAll() { vps.forEach(draw); }

  // ---------- 동기화 ----------
  function changeSlice(vp, delta, absolute) {
    const ser = series[vp.seriesIdx];
    if (!ser) return;
    const ni = clampN(absolute != null ? absolute : vp.sliceIdx + delta, 0, ser.slices.length - 1);
    if (ni === vp.sliceIdx) return;
    vp.sliceIdx = ni;
    if (vp === active && core.edit) core.edit.targetChanged();   // 다른 장으로 넘어가면 진행 중인 선택 취소
    const s = ser.slices[ni];
    // 찍은 위치를 새 단면 위로 옮김 → 다른 화면의 십자 표시가 함께 따라감
    if (cursor && s.geom && sameSpace(cursor.space, s.space)) {
      const n = s.geom.normal;
      cursor.X = sub(cursor.X, mul(n, dot(sub(cursor.X, s.geom.ipp), n)));
    }
    showSlice(vp);
    if (opts.sync) syncFrom(vp);
    drawAll();
  }

  // src 화면 위치에 다른 화면들을 맞춤
  function syncFrom(src) {
    const ss = currentSlice(src), srcSer = series[src.seriesIdx];
    if (!ss) return;
    for (const vp of vps) {
      if (vp === src) continue;
      const idx = targetIndex(vp, ss, srcSer, src);
      if (idx != null && idx !== vp.sliceIdx) { vp.sliceIdx = idx; showSlice(vp); }
    }
  }
  // vp 하나를 다른 화면(활성 화면) 위치에 맞춤
  function syncTo(vp) {
    const ref = vps.find((v) => v !== vp && currentSlice(v));
    if (!ref) return;
    const idx = targetIndex(vp, currentSlice(ref), series[ref.seriesIdx], ref);
    if (idx != null) vp.sliceIdx = idx;
  }

  function targetIndex(vp, ss, srcSer, src) {
    const ser = series[vp.seriesIdx];
    if (!ser) return null;
    if (ss.geom && ser.geom) {
      if (!sameSpace(ss.space, ser.slices[0].space)) return null;
      if (cursor && sameSpace(cursor.space, ss.space)) return nearestSlice(ser, cursor.X);
      // 같은 방향 슬라이스가 있으면 지금 단면의 중심과 가장 가까운 장으로, 없으면 그대로 두고 기준선으로 표시
      return nearestSlice(ser, ss.center, ss.geom.normal);
    }
    if (!ss.geom && !ser.geom) {
      // 위치 정보가 없는 그림: 같은 비율의 순번
      const n = srcSer.slices.length;
      return n > 1 ? Math.round((src.sliceIdx / (n - 1)) * (ser.slices.length - 1)) : 0;
    }
    return null;
  }

  function setCursorAt(vp, clientX, clientY) {
    const s = currentSlice(vp);
    if (!s || !s.geom || !vp.xf || !vp.data || vp.xf.transformed) return;
    const r = vp.canvas.getBoundingClientRect(), dpr = vp.xf.dpr;
    const x = ((clientX - r.left) * dpr - vp.xf.dx) / vp.xf.px - 0.5;
    const y = ((clientY - r.top) * dpr - vp.xf.dy) / vp.xf.py - 0.5;
    if (x < -0.5 || y < -0.5 || x > vp.data.cols - 0.5 || y > vp.data.rows - 0.5) return;
    cursor = { X: pixelTo3D(s.geom, x, y), space: s.space };
    if (opts.sync) syncFrom(vp);
    drawAll();
  }
  function clearCursor() { cursor = null; drawAll(); }

  function setZoom(vp, z, clientX, clientY) {
    z = clampN(z, 0.1, 40);
    const r = vp.canvas.getBoundingClientRect();
    const mx = clientX == null ? r.width / 2 : clientX - r.left, my = clientY == null ? r.height / 2 : clientY - r.top;
    const f = z / vp.zoom;
    vp.panX = mx - r.width / 2 - (mx - r.width / 2 - vp.panX) * f;
    vp.panY = my - r.height / 2 - (my - r.height / 2 - vp.panY) * f;
    vp.zoom = z;
    if (opts.zoomSync) vps.forEach((o) => { if (o !== vp) o.zoom = z; });
    drawAll();
  }

  function setWL(vp, wl) {
    vp.wl = wl;
    paintOff(vp);
    if (opts.wlSync) vps.forEach((o) => { if (o !== vp && o.data && o.data.fr && o.data.fr.kind === 'gray') { o.wl = wl && { ...wl }; paintOff(o); } });
    drawAll();
  }

  // ---------- 마우스·키보드 ----------
  function bindPointer(vp) {
    let drag = null;
    const body = vp.body;
    body.addEventListener('contextmenu', (e) => e.preventDefault());
    body.addEventListener('pointerdown', (e) => {
      if (e.target.tagName === 'INPUT') return;   // 글자 입력 칸
      setActive(vp);
      if (core.edit && core.edit.down(e, body)) { drag = null; return; }   // 편집 도구가 처리
      drawAll();
      const gray = vp.data && vp.data.fr && vp.data.fr.kind === 'gray';
      const wlMode = (e.button === 2 || (e.button === 0 && e.shiftKey)) && gray;
      if (e.button !== 0 && !wlMode) return;
      drag = { wl: wlMode, x: e.clientX, y: e.clientY, moved: false, panX: vp.panX, panY: vp.panY,
        start: gray ? { ...(vp.wl || vp.data.fr.defaultWL) } : null,
        range: gray ? Math.max(1, vp.data.fr.max - vp.data.fr.min) : 1 };
      try { body.setPointerCapture(e.pointerId); } catch {}
    });
    body.addEventListener('pointermove', (e) => {
      if (core.edit && core.edit.move(e)) return;
      if (!drag) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
      if (!drag.moved) return;
      if (drag.wl) {
        const k = drag.range / 400;
        setWL(vp, { w: Math.max(1, drag.start.w + dx * k), c: drag.start.c + dy * k });
      } else {
        vp.panX = drag.panX + dx; vp.panY = drag.panY + dy;
        draw(vp);
      }
    });
    body.addEventListener('pointerup', (e) => {
      if (core.edit && core.edit.up(e)) { drag = null; return; }
      if (drag && !drag.moved && !drag.wl && e.button === 0) setCursorAt(vp, e.clientX, e.clientY);
      drag = null;
    });
    body.addEventListener('pointercancel', (e) => { if (core.edit) core.edit.up(e); drag = null; });
    body.addEventListener('dblclick', (e) => {
      if (core.edit && core.edit.dbl(e)) return; vp.zoom = 1; vp.panX = vp.panY = 0; if (opts.zoomSync) vps.forEach((o) => { o.zoom = 1; }); drawAll(); });
    body.addEventListener('wheel', (e) => {
      e.preventDefault();
      setActive(vp);
      if (e.ctrlKey) { setZoom(vp, vp.zoom * (e.deltaY < 0 ? 1.25 : 0.8), e.clientX, e.clientY); return; }
      // 마우스 휠 한 칸 = 1장, 터치패드는 조금씩 모아서 넘김
      vp.wheelAcc += e.deltaMode === 1 ? e.deltaY * 40 : e.deltaMode === 2 ? e.deltaY * 800 : e.deltaY;
      const steps = Math.trunc(vp.wheelAcc / 100);
      if (steps) { vp.wheelAcc -= steps * 100; changeSlice(vp, steps); }
    }, { passive: false });
  }

  function onKey(e) {
    if (!api.active || !active) return;
    if (e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement) return;
    const k = e.key;
    if (k === 'ArrowDown' || k === 'ArrowRight' || k === 'PageDown') changeSlice(active, 1);
    else if (k === 'ArrowUp' || k === 'ArrowLeft' || k === 'PageUp') changeSlice(active, -1);
    else if (k === 'Home') changeSlice(active, 0, 0);
    else if (k === 'End') changeSlice(active, 0, Infinity);
    else if (k === '+' || k === '=') setZoom(active, active.zoom * 1.25);
    else if (k === '-' || k === '_') setZoom(active, active.zoom * 0.8);
    else if (k === '0') { active.zoom = 1; active.panX = active.panY = 0; drawAll(); }
    else if (k === 'a' || k === 'A') setWL(active, null);
    else if (k === 'c' || k === 'C') clearCursor();
    else return;
    e.preventDefault();
    e.stopImmediatePropagation();
  }

  // ---------- 바깥(index.html)과 연결 ----------
  async function rebuild() {
    entriesRef = core.entries();
    const token = ++buildToken;
    series = []; cursor = null;
    closed = []; refreshReopen();   // 새 폴더를 열면 이전 폴더의 닫은 화면은 의미가 없으므로 비움
    frameCache.clear(); infoCache.clear();
    vps.forEach((vp) => { vp.seriesIdx = -1; vp.data = null; vp.off = null; fillSelect(vp); });
    drawAll();
    if (!entriesRef.length) { status('먼저 "폴더 열기"로 영상 폴더를 열어 주세요.'); return; }
    status('영상 정보를 읽는 중…');
    const list = await buildSeries(entriesRef, (d, n) => { if (token === buildToken) status(`영상 정보를 읽는 중… ${d}/${n}`); });
    if (token !== buildToken) return;
    series = list;
    status(series.length ? `시리즈 ${series.length}개` : '볼 수 있는 영상이 없습니다.');
    vps.forEach((vp) => { vp.seriesIdx = -1; });
    vps.forEach((vp) => { if (series.length) assignDefault(vp); fillSelect(vp); });
    if (opts.sync && vps[0]) vps.slice(1).forEach(syncTo);
    vps.forEach(showSlice);
    drawAll();
  }

  const api = {
    active: false,
    init(c) { core = c; },
    async open() {
      ensureUI();
      api.active = true;
      root.hidden = false;
      layout();
      if (entriesRef !== core.entries()) await rebuild();
      else drawAll();
    },
    close() { api.active = false; if (root) root.hidden = true; },
    reload() { if (api.active) rebuild(); else entriesRef = null; },
    redraw() { if (api.active) drawAll(); },
    // 편집 대상: 지금 선택한 창의 그림 (index.html의 편집 기능이 사용)
    editTarget() {
      const vp = active, s = vp && currentSlice(vp);
      if (!vp || !s || !vp.data || !vp.xf) return null;
      const xf = () => vp.xf;
      return {
        entry: () => s.entry,
        key: () => (s.entry.kind.decoder === 'dicom' ? 'f' + s.frame : 'img'),
        frameLabel: () => (s.frame ? s.frame + 1 : 0),
        base: () => vp.off || (vp.data && vp.data.src),
        w: () => vp.data.cols, h: () => vp.data.rows,
        ready: () => !!(vp.data && vp.xf),
        scale: () => xf().px / xf().dpr,
        toView: (e) => {
          const r = vp.canvas.getBoundingClientRect();
          return [((e.clientX - r.left) * xf().dpr - xf().dx) / xf().px, ((e.clientY - r.top) * xf().dpr - xf().dy) / xf().py];
        },
        viewBox: (p) => ({ parent: vp.body, left: (xf().dx + p[0] * xf().px) / xf().dpr, top: (xf().dy + p[1] * xf().py) / xf().dpr, scale: xf().px / xf().dpr }),
        render: () => drawAll(),   // 같은 그림을 띄운 다른 창에도 함께 반영
      };
    },
  };
  window.MultiView = api;
})();

</script>
<script>
(() => {
  'use strict';

  // ---------- 실행 방식 판별 ----------
  // serve.py로 실행하면 토큰이 들어 있음 → 서버가 디스크에서 직접 읽는 방식(업로드 문구 없음)
  // index.html을 바로 열면 → 브라우저가 직접 읽는 방식
  const TOKEN = document.querySelector('meta[name="viewer-token"]').content;
  const SERVER_MODE = location.protocol.startsWith('http') && TOKEN !== '__VIEWER_' + 'TOKEN__';

  // ---------- 외부 라이브러리 (필요할 때만 로드, 무결성 해시로 검증) ----------
  const LIBS = {
    pako: { src: 'https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js',
            integrity: 'sha384-rNlaE5fs9dGIjmxWDALQh/RBAaGRYT5ChrzHo6tRfgrZ36iRFAiquP5g41Jsv+0j' },
    utif: { src: 'https://cdn.jsdelivr.net/npm/utif@3.1.0/UTIF.js',
            integrity: 'sha384-RyBmXHdfZ/Uon+ud+/AqSyWpUWnKYt2tkRG/P4gWoRUGDU+qIAV3tGBPNlYTBZEF' },
  };

  const $ = (id) => document.getElementById(id);
  const el = {
    main: $('main'), list: $('list'), folderName: $('folderName'), viewer: $('viewer'), img: $('img'), cv: $('cv'),
    message: $('message'), counter: $('counter'), zoomInput: $('zoomInput'),
    fname: $('fname'), finfo: $('finfo'), fmode: $('fmode'), fwl: $('fwl'), fsafe: $('fsafe'),
    prev: $('prevBtn'), next: $('nextBtn'), fit: $('fitBtn'), width: $('widthBtn'), actual: $('actualBtn'),
    pixel: $('pixelBtn'), listBtn: $('listBtn'), recentSel: $('recentSel'), reopen: $('reopenBtn'),
    dicomGroup: $('dicomGroup'), frameLabel: $('frameLabel'), wl: $('wlBtn'),
    ec: $('ec'), textInput: $('textInput'),
  };

  // ---------- 설정 저장 (브라우저 안에만 저장, 실패해도 동작) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem('iv.' + k); return v === null ? d : v; } catch { return d; } },
    set(k, v) { try { localStorage.setItem('iv.' + k, String(v)); } catch {} },
  };

  const MIN_SCALE = 0.02, MAX_SCALE = 64;
  const state = {
    entries: [],
    index: -1,
    frame: 0,             // DICOM 다중 프레임 번호
    // mode: 'fit' (화면 맞춤) | 'width' (너비 맞춤) | 'fixed' (사용자가 정한 배율 유지)
    mode: store.get('mode', 'fit'),
    scale: clamp(parseFloat(store.get('scale', '1')) || 1),
    current: 1,
    pixelated: store.get('pixel', '0') === '1',
    wl: null,             // null = 영상마다 기본 W/L, {c,w} = 사용자가 정한 W/L을 다른 영상에도 유지
    loadToken: 0,
  };
  // 지금 화면에 보이는 요소(img, DICOM canvas, 또는 편집 결과 canvas)와 원본 그림 요소
  const view = { el: null, w: 0, h: 0, base: null, bw: 0, bh: 0 };

  function clamp(s) { return Math.min(MAX_SCALE, Math.max(MIN_SCALE, s)); }

  // ---------- 그림 종류 ----------
  const KINDS = {
    'JPEG': { type: 'JPEG', mime: 'image/jpeg' },
    'PNG': { type: 'PNG', mime: 'image/png' },
    'GIF': { type: 'GIF', mime: 'image/gif' },
    'WebP': { type: 'WebP', mime: 'image/webp' },
    'BMP': { type: 'BMP', mime: 'image/bmp' },
    'TIFF': { type: 'TIFF', decoder: 'tiff' },
    'ICO': { type: 'ICO', mime: 'image/x-icon' },
    'CUR': { type: 'CUR', mime: 'image/x-icon' },
    'AVIF': { type: 'AVIF', mime: 'image/avif' },
    'SVG': { type: 'SVG', mime: 'image/svg+xml' },   // <img>로 표시 → SVG 안의 스크립트는 실행되지 않음
    'DICOM': { type: 'DICOM', decoder: 'dicom' },
    'HEIC': { type: 'HEIC', unsupported: 'HEIC(아이폰 사진)는 다음 버전에서 지원 예정입니다.' },
    'JPEG XL': { type: 'JPEG XL', unsupported: 'JPEG XL은 브라우저가 아직 지원하지 않습니다.' },
    'PSD': { type: 'PSD', unsupported: 'PSD(포토샵)는 아직 지원하지 않습니다.' },
  };

  // ---------- 파일 내용으로 그림 판별 (확장자 무시, serve.py와 같은 규칙) ----------
  const ascii = (b, o, n) => String.fromCharCode(...b.subarray(o, o + n));
  const upper = (c) => c >= 65 && c <= 90;

  function sniffBytes(b) {
    if (b.length < 4) return null;
    // DICOM을 먼저 확인: 앞 128바이트 머리말에 TIFF 같은 다른 형식 표시가 들어 있는 경우가 있음
    if (b.length > 132 && ascii(b, 128, 4) === 'DICM') return 'DICOM';
    if (b[0] === 0xFF && b[1] === 0xD8 && b[2] === 0xFF) return 'JPEG';
    if (b[0] === 0x89 && ascii(b, 1, 3) === 'PNG') return 'PNG';
    if (ascii(b, 0, 4) === 'GIF8') return 'GIF';
    if (ascii(b, 0, 4) === 'RIFF' && ascii(b, 8, 4) === 'WEBP') return 'WebP';
    if (ascii(b, 0, 2) === 'BM' && b.length > 18 && [12, 40, 52, 56, 64, 108, 124].includes(b[14] | (b[15] << 8) | (b[16] << 16) | (b[17] << 24))) return 'BMP';
    if ((b[0] === 0x49 && b[1] === 0x49 && b[2] === 0x2A && b[3] === 0) ||
        (b[0] === 0x4D && b[1] === 0x4D && b[2] === 0 && b[3] === 0x2A)) return 'TIFF';
    if (b[0] === 0 && b[1] === 0 && (b[2] === 1 || b[2] === 2) && b[3] === 0 && b[4] > 0 && b[5] === 0) return b[2] === 1 ? 'ICO' : 'CUR';
    if (ascii(b, 4, 4) === 'ftyp') {
      const brands = ascii(b, 8, Math.min(32, b.length - 8));
      if (/avi[fs]/.test(brands)) return 'AVIF';
      if (/hei[cxms]|hev[cx]|mif1|msf1/.test(brands)) return 'HEIC';
    }
    if ((b[0] === 0xFF && b[1] === 0x0A) || ascii(b, 4, 4) === 'JXL ') return 'JPEG XL';
    if (b.length >= 12) {   // 머리말 없는 오래된 DICOM
      if ((b[0] === 2 || b[0] === 8) && b[1] === 0 && b[3] === 0 &&
          ((upper(b[4]) && upper(b[5])) || (b[4] | (b[5] << 8) | (b[6] << 16) | (b[7] << 24)) >>> 0 < 1024)) return 'DICOM';
      if (b[0] === 0 && (b[1] === 2 || b[1] === 8) && b[2] === 0 && upper(b[4]) && upper(b[5])) return 'DICOM';
    }
    if (ascii(b, 0, 4) === '8BPS') return 'PSD';
    const text = new TextDecoder('utf-8', { fatal: false }).decode(b).replace(/^﻿/, '').trimStart();
    if (text.startsWith('<') && /<svg[\s>]/i.test(text)) return 'SVG';
    return null;
  }
  async function sniff(blob) {
    if (blob.size < 4) return null;
    return sniffBytes(new Uint8Array(await blob.slice(0, 4096).arrayBuffer()));
  }

  // ---------- 서버(serve.py) 통신: 이 컴퓨터 안에서만 ----------
  async function api(path, params = {}) {
    const u = new URL(path, location.origin);
    for (const [k, v] of Object.entries(params)) if (v != null) u.searchParams.set(k, v);
    let r;
    try { r = await fetch(u, { headers: { 'X-Viewer-Token': TOKEN }, cache: 'no-store' }); }
    catch {
      // serve.py가 꺼진 경우 (검은 명령 프롬프트 창을 닫은 경우 등)
      throw new Error('serve.py가 꺼져 있습니다. 검은 명령 프롬프트 창을 닫으면 뷰어 서버가 꺼집니다. serve.py를 다시 실행한 뒤 이 화면을 새로고침(F5)해 주세요.');
    }
    if (r.status === 403) {
      throw new Error('serve.py가 다시 시작되어 이 화면의 접속 정보가 바뀌었습니다. 새로고침(F5)해 주세요.');
    }
    if (path === '/api/file') {
      if (!r.ok) throw new Error('파일을 읽지 못했습니다.');
      return r.blob();
    }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || '요청에 실패했습니다.');
    return j;
  }

  // 편집한 그림 저장 요청 (원본과 같은 폴더에 새 PNG로)
  async function apiPost(path, params, body) {
    const u = new URL(path, location.origin);
    for (const [k, v] of Object.entries(params)) if (v != null && v !== '') u.searchParams.set(k, v);
    let r;
    try { r = await fetch(u, { method: 'POST', headers: { 'X-Viewer-Token': TOKEN, 'Content-Type': 'application/octet-stream' }, body, cache: 'no-store' }); }
    catch { throw new Error('serve.py가 꺼져 있습니다. serve.py를 다시 실행한 뒤 이 화면을 새로고침(F5)해 주세요.'); }
    if (r.status === 403) throw new Error('serve.py가 다시 시작되어 이 화면의 접속 정보가 바뀌었습니다. 새로고침(F5)해 주세요.');
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || '저장하지 못했습니다.');
    return j;
  }

  async function serverPick(kind) {
    showMessage(kind === 'folder' ? '폴더 선택 창을 띄웠습니다' : '파일 선택 창을 띄웠습니다',
      '작업 표시줄에서 선택 창을 확인해 주세요.');
    try {
      const r = await api(kind === 'folder' ? '/api/pick-folder' : '/api/pick-file', { initial: store.get('lastDir', null) });
      if (r.cancelled) { restoreAfterCancel(); return; }
      await openServerFolder(r);
    } catch (err) { showMessage('열 수 없습니다', err.message, true); }
  }

  async function openServerFolder({ dir, select, recursive }) {
    showMessage('폴더를 읽는 중…', dir);
    const j = await api('/api/list', { dir, recursive: recursive ? '1' : '0' });
    store.set('lastDir', j.dir);
    el.folderName.textContent = `📂 ${j.dir}`;
    el.folderName.title = j.dir;
    const found = j.files.map((f) => ({ source: 'server', dir: j.dir, rel: f.rel, path: f.rel, size: f.size, kind: KINDS[f.type] }))
      .filter((e) => e.kind);
    setEntries(found, select, j.truncated ? '파일이 너무 많아 일부만 표시합니다.' : '');
    refreshRecent();
  }

  async function refreshRecent(list) {
    if (!SERVER_MODE) return;
    try { if (!list) list = (await api('/api/start')).recent || []; } catch { return; }
    el.recentSel.replaceChildren(new Option('최근 폴더…', ''));
    for (const d of list) el.recentSel.append(new Option(d.split(/[\\/]/).filter(Boolean).pop() || d, d));
    [...el.recentSel.options].forEach((o) => { if (o.value) o.title = o.value; });
    el.recentSel.hidden = list.length === 0;
  }

  function restoreAfterCancel() {
    if (state.entries.length) show(Math.max(0, state.index)); else showWelcome();
  }

  // ---------- 브라우저가 직접 읽는 방식 (index.html을 바로 연 경우, 끌어다 놓기) ----------
  const collator = new Intl.Collator('ko', { numeric: true, sensitivity: 'base' });

  async function loadLocalFiles(fileList, folderLabel) {
    const files = Array.from(fileList).filter((f) => f.size > 0);
    if (!files.length) return;
    showMessage('그림 파일을 찾는 중…', `0 / ${files.length}`);
    const found = [];
    const BATCH = 24;
    for (let i = 0; i < files.length; i += BATCH) {
      const chunk = files.slice(i, i + BATCH);
      const kinds = await Promise.all(chunk.map((f) => sniff(f).catch(() => null)));
      kinds.forEach((k, j) => {
        if (k) {
          const f = chunk[j];
          found.push({ source: 'local', file: f, path: f.webkitRelativePath || f._path || f.name, size: f.size, kind: KINDS[k],
            dirHandle: f._dirHandle || null, rootHandle: f._rootHandle || null });
        }
      });
      showMessage('그림 파일을 찾는 중…', `${Math.min(i + BATCH, files.length)} / ${files.length}`);
    }
    el.folderName.textContent = folderLabel ? `📂 ${folderLabel}` : '';
    setEntries(found, null, '', files.length);
  }

  function setEntries(found, selectPath, note, scanned) {
    if (Editor.unsavedCount() && !confirm('저장하지 않은 편집이 있습니다. 다른 폴더를 열면 편집 내용이 사라집니다. 계속할까요?')) {
      restoreAfterCancel();
      return;
    }
    Editor.toggle(false);
    found.sort((a, b) => collator.compare(a.path, b.path));
    releaseAll();
    state.entries = found;
    state.index = -1;
    renderList();
    if (window.MultiView) window.MultiView.reload();
    if (!found.length) {
      showMessage('그림 파일이 없습니다', scanned ? `파일 ${scanned}개를 검사했지만 그림을 찾지 못했습니다.` : '이 폴더에는 그림 파일이 없습니다.', true);
      hideView();
      updateUI();
      return;
    }
    const i = selectPath ? found.findIndex((e) => e.path === selectPath) : 0;
    show(Math.max(0, i));
    if (note) el.fsafe.textContent = note;
  }

  async function filesFromDrop(dt) {
    const items = Array.from(dt.items || []).map((it) => it.webkitGetAsEntry && it.webkitGetAsEntry()).filter(Boolean);
    if (!items.length) return Array.from(dt.files || []);
    const out = [];
    async function walk(entry, prefix) {
      if (entry.isFile) {
        const f = await new Promise((res, rej) => entry.file(res, rej));
        f._path = prefix + f.name;
        out.push(f);
      } else if (entry.isDirectory) {
        const reader = entry.createReader();
        let batch;
        do {
          batch = await new Promise((res, rej) => reader.readEntries(res, rej));
          for (const child of batch) await walk(child, prefix + entry.name + '/');
        } while (batch.length);
      }
    }
    for (const entry of items) await walk(entry, '');
    return out;
  }

  // File System Access API (Chrome/Edge): 업로드가 아닌 "보기 권한"만 요청
  const canPickDir = typeof window.showDirectoryPicker === 'function';
  async function filesFromDirHandle(dir, prefix = '', root = dir) {
    const out = [];
    for await (const [name, handle] of dir.entries()) {
      try {
        if (handle.kind === 'file') {
          const f = await handle.getFile();
          f._path = prefix + name;
          f._dirHandle = dir;      // 편집한 그림을 원본과 같은 폴더에 저장할 때 사용
          f._rootHandle = root;
          out.push(f);
        }
        else if (handle.kind === 'directory') out.push(...await filesFromDirHandle(handle, prefix + name + '/', root));
      } catch { /* 읽을 수 없는 항목은 건너뜀 */ }
    }
    return out;
  }
  async function openDirHandle(dir) {
    showMessage(`"${dir.name}" 폴더를 읽는 중…`, '');
    const files = await filesFromDirHandle(dir);
    if (!files.length) { showMessage('빈 폴더입니다', dir.name, true); return; }
    await loadLocalFiles(files, dir.name);
    saveLastDir(dir);
  }
  async function browserPickFolder() {
    if (!canPickDir) { $('folderInput').click(); return; }
    try { await openDirHandle(await window.showDirectoryPicker({ id: 'image-viewer', mode: 'read' })); }
    catch (err) { if (err.name !== 'AbortError') showMessage('폴더를 열 수 없습니다', err.message, true); }
  }
  function idb() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('image-viewer', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  async function idbDo(mode, fn) {
    const db = await idb();
    return new Promise((res, rej) => {
      const tx = db.transaction('kv', mode);
      const req = fn(tx.objectStore('kv'));
      tx.oncomplete = () => { db.close(); res(req && req.result); };
      tx.onerror = () => { db.close(); rej(tx.error); };
    });
  }
  async function saveLastDir(dir) {
    try { await idbDo('readwrite', (s) => s.put(dir, 'lastDir')); el.reopen.hidden = false; el.reopen.title = `"${dir.name}" 폴더 다시 열기`; } catch {}
  }
  async function loadLastDir() { try { return await idbDo('readonly', (s) => s.get('lastDir')); } catch { return null; } }
  async function reopenFolder() {
    const dir = await loadLastDir();
    if (!dir) { el.reopen.hidden = true; return; }
    try {
      let perm = await dir.queryPermission({ mode: 'read' });
      if (perm !== 'granted') perm = await dir.requestPermission({ mode: 'read' });
      if (perm === 'granted') await openDirHandle(dir);
    } catch {
      showMessage('지난 폴더를 다시 열 수 없습니다', '폴더가 옮겨졌거나 지워졌을 수 있습니다. "폴더 열기"로 다시 선택해 주세요.', true);
    }
  }

  // ---------- 파일 내용 가져오기 + 메모리 관리 ----------
  const cache = [];
  const CACHE_MAX = 8;

  function remember(entry) {
    const i = cache.indexOf(entry);
    if (i >= 0) cache.splice(i, 1);
    cache.push(entry);
    while (cache.length > CACHE_MAX) release(cache.shift());
  }
  function release(e) {
    if (e.url) URL.revokeObjectURL(e.url);
    e.url = null; e.blob = null; e.dicom = null; e.decoded = null; e.blobPromise = null;
  }
  function releaseAll() { for (const e of state.entries) release(e); cache.length = 0; }

  function getBlob(entry) {
    if (entry.source === 'local') return Promise.resolve(entry.file);
    if (entry.blob) return Promise.resolve(entry.blob);
    if (!entry.blobPromise) {
      entry.blobPromise = api('/api/file', { dir: entry.dir, rel: entry.rel }).then(async (b) => {
        entry.blob = b;
        // 클라우드 파일처럼 확장자로만 추정했던 경우 실제 내용으로 다시 확인
        const real = await sniff(b);
        if (real && KINDS[real]) entry.kind = KINDS[real];
        return b;
      }, (err) => { entry.blobPromise = null; throw err; });
    }
    return entry.blobPromise;
  }

  function prefetch(i) {
    const e = state.entries[i];
    if (e && e.source === 'server' && !e.blob && !e.kind.unsupported) getBlob(e).then(() => remember(e)).catch(() => {});
  }

  function loadScript({ src, integrity }) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src; s.integrity = integrity; s.crossOrigin = 'anonymous'; s.referrerPolicy = 'no-referrer';
      s.onload = resolve;
      s.onerror = () => reject(new Error('해석 라이브러리를 불러오지 못했습니다 (인터넷 연결 확인).'));
      document.head.appendChild(s);
    });
  }
  const libReady = {};
  function ensureLib(...names) {
    return names.reduce((p, n) => p.then(() => {
      // 파일 하나짜리 버전처럼 라이브러리가 이미 들어 있으면 인터넷에서 받지 않음
      if ((n === 'pako' && window.pako) || (n === 'utif' && window.UTIF)) return;
      if (!libReady[n]) { libReady[n] = loadScript(LIBS[n]); libReady[n].catch(() => { libReady[n] = null; }); }
      return libReady[n];
    }), Promise.resolve());
  }

  async function tiffToBlob(blob) {
    await ensureLib('pako', 'utif');
    const buf = await blob.arrayBuffer();
    const ifds = window.UTIF.decode(buf);
    if (!ifds.length) throw new Error('TIFF 안에 그림이 없습니다.');
    const page = ifds[0];
    window.UTIF.decodeImage(buf, page, ifds);
    const rgba = window.UTIF.toRGBA8(page);
    const canvas = document.createElement('canvas');
    canvas.width = page.width; canvas.height = page.height;
    canvas.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(rgba.buffer, 0, page.width * page.height * 4), page.width, page.height), 0, 0);
    return new Promise((res, rej) => canvas.toBlob((b) => (b ? res(b) : rej(new Error('변환 실패'))), 'image/png'));
  }

  async function parseDicom(buf) {
    const D = window.DicomDecoder;
    try { return D.parse(buf, { inflateRaw: window.pako && window.pako.inflateRaw }); }
    catch (err) {
      if (err.code !== 'need-inflate') throw err;
      await ensureLib('pako');
      return D.parse(buf, { inflateRaw: window.pako.inflateRaw });
    }
  }

  // ---------- 보기 ----------
  async function show(i) {
    if (!state.entries.length) return;
    i = Math.max(0, Math.min(state.entries.length - 1, i));
    const entry = state.entries[i];
    const token = ++state.loadToken;

    // 이전 그림에서 보던 위치(비율)를 기억해 다음 그림에서도 같은 부분을 보여줌
    const v = el.viewer;
    const keep = view.el ? {
      x: v.scrollWidth > v.clientWidth ? v.scrollLeft / (v.scrollWidth - v.clientWidth) : 0.5,
      y: v.scrollHeight > v.clientHeight ? v.scrollTop / (v.scrollHeight - v.clientHeight) : 0.5,
    } : { x: 0.5, y: 0.5 };

    if (i !== state.index) { state.frame = 0; Editor.resetTransient(); }
    state.index = i;
    updateUI();

    if (entry.kind.unsupported) { hideView(); showMessage(`${entry.kind.type} 형식`, entry.kind.unsupported, true); return; }
    try {
      const blob = await getBlob(entry);
      if (token !== state.loadToken) return;
      remember(entry);
      if (entry.kind.unsupported) throw new Error(entry.kind.unsupported);
      if (entry.kind.decoder === 'dicom') await showDicom(entry, blob, token);
      else await showImage(entry, blob, token);
      if (token !== state.loadToken) return;
      hideMessage();
      v.scrollLeft = keep.x * (v.scrollWidth - v.clientWidth);
      v.scrollTop = keep.y * (v.scrollHeight - v.clientHeight);
      updateUI();
      prefetch(i + 1);
    } catch (err) {
      if (token !== state.loadToken) return;
      hideView();
      showMessage('그림을 열 수 없습니다', err.message, true);
      updateUI();
    }
  }

  async function showImage(entry, blob, token) {
    if (!entry.url) {
      const b = entry.kind.decoder === 'tiff' ? await tiffToBlob(blob) : blob.slice(0, blob.size, entry.kind.mime);
      entry.url = URL.createObjectURL(b);
    }
    if (token !== state.loadToken) return;
    await new Promise((res, rej) => {
      el.img.onload = res;
      el.img.onerror = () => rej(new Error('이 브라우저가 그림을 표시하지 못했습니다.'));
      el.img.src = entry.url;
    });
    if (token !== state.loadToken) return;
    entry.w = el.img.naturalWidth; entry.h = el.img.naturalHeight;
    setBase(el.img, entry.w, entry.h);
  }

  async function showDicom(entry, blob, token) {
    if (!entry.dicom) {
      entry.dicom = await parseDicom(await blob.arrayBuffer());
      entry.decoded = new Map();
    }
    if (token !== state.loadToken) return;
    const info = entry.dicom;
    if (info.noPixel) throw new Error('영상이 없는 DICOM 파일입니다 (DICOMDIR 목록·보고서 등).');
    if (info.unsupported) throw new Error(info.unsupported);
    state.frame = Math.min(state.frame, info.frames - 1);
    await drawDicomFrame(entry, token);
  }

  async function drawDicomFrame(entry, token) {
    const info = entry.dicom, f = state.frame;
    let fr = entry.decoded.get(f);
    if (!fr) {
      fr = await window.DicomDecoder.decodeFrame(info, f);
      entry.decoded.set(f, fr);
      if (entry.decoded.size > 8) entry.decoded.delete(entry.decoded.keys().next().value);
    }
    if (token !== state.loadToken) return;
    entry.w = info.cols; entry.h = info.rows; entry.frameData = fr;
    paintDicom(entry);
    setBase(el.cv, info.cols, info.rows);
  }

  let paintBuf = null;
  function paintDicom(entry) {
    const fr = entry.frameData, info = entry.dicom;
    if (!fr) return;
    const cv = el.cv;
    if (cv.width !== info.cols || cv.height !== info.rows) { cv.width = info.cols; cv.height = info.rows; paintBuf = null; }
    const g = cv.getContext('2d');
    if (!paintBuf) paintBuf = g.createImageData(info.cols, info.rows);
    if (fr.kind === 'gray') {
      const wl = state.wl || fr.defaultWL;
      window.DicomDecoder.renderGray(fr, wl.c, wl.w, paintBuf.data);
    } else paintBuf.data.set(fr.rgba);
    g.putImageData(paintBuf, 0, 0);
    cv._ver = Math.random();   // 편집 결과를 다시 만들어야 함을 표시
    if (view.el === el.ec) Editor.renderSingle();   // 편집 중이면 W/L 바뀐 영상 위에 다시 그림
    updateDicomUI();
  }

  async function changeFrame(delta) {
    const e = currentEntry();
    if (!e || !e.dicom || e.dicom.frames < 2) return;
    const nf = Math.max(0, Math.min(e.dicom.frames - 1, state.frame + delta));
    if (nf === state.frame) return;
    state.frame = nf;
    const token = ++state.loadToken;
    try { await drawDicomFrame(e, token); hideMessage(); }
    catch (err) { showMessage('프레임을 열 수 없습니다', err.message, true); }
    updateUI();
  }

  const currentEntry = () => state.entries[state.index];
  const isGrayDicom = () => { const e = currentEntry(); return !!(e && e.frameData && e.frameData.kind === 'gray' && view.el && view.base === el.cv); };

  function setView(node, w, h) {
    for (const n of [el.img, el.cv, el.ec]) n.style.display = n === node ? 'block' : 'none';
    view.el = node; view.w = w; view.h = h;
    applyZoom();
  }
  // 원본 그림이 준비되면: 편집 중이거나 편집 내용이 있으면 편집 결과를, 아니면 원본을 보여 줌
  function setBase(node, w, h) {
    view.base = node; view.bw = w; view.bh = h;
    refreshView();
  }
  function refreshView() {
    if (!view.base) return;
    if (Editor.active || Editor.hasOpsSingle()) { const d = Editor.renderSingle(); setView(el.ec, d.w, d.h); }
    else setView(view.base, view.bw, view.bh);
    Editor.updateUIState();   // 그림이 바뀌면 되돌리기 등 버튼 상태도 그 그림에 맞춤
  }
  function hideView() {
    for (const n of [el.img, el.cv, el.ec]) n.style.display = 'none';
    view.el = null; view.w = view.h = 0; view.base = null;
  }

  function computeScale() {
    if (!view.w || !view.h) return 1;
    const availW = el.viewer.clientWidth - 16, availH = el.viewer.clientHeight - 16;
    if (state.mode === 'fit') return clamp(Math.min(availW / view.w, availH / view.h)); // 작은 그림도 화면에 맞게 키움
    if (state.mode === 'width') return clamp(availW / view.w);
    return state.scale;
  }

  function applyZoom() {
    if (view.el) {
      state.current = computeScale();
      view.el.style.width = view.w * state.current + 'px';
      view.el.style.height = view.h * state.current + 'px';
      if (view.el === el.ec) Editor.renderSingle();   // 확대 배율에 맞는 해상도로 다시 그림
    }
    updateZoomUI();
  }

  // 지정한 점(마우스 위치)을 기준으로 확대/축소 → 이후 이 배율을 다른 그림에도 유지
  function zoomTo(newScale, cx, cy) {
    newScale = clamp(newScale);
    if (!view.el) { state.mode = 'fixed'; state.scale = newScale; saveZoom(); updateZoomUI(); return; }
    const vr = el.viewer.getBoundingClientRect();
    if (cx == null) { cx = vr.left + el.viewer.clientWidth / 2; cy = vr.top + el.viewer.clientHeight / 2; }
    const r1 = view.el.getBoundingClientRect();
    const ix = (cx - r1.left) / state.current, iy = (cy - r1.top) / state.current;
    state.mode = 'fixed'; state.scale = newScale; saveZoom();
    applyZoom();
    const r2 = view.el.getBoundingClientRect();
    el.viewer.scrollLeft += r2.left + ix * newScale - cx;
    el.viewer.scrollTop += r2.top + iy * newScale - cy;
  }
  function zoomStep(dir, cx, cy) { zoomTo(state.current * (dir > 0 ? 1.25 : 1 / 1.25), cx, cy); }
  function setMode(mode) {
    state.mode = mode;
    if (mode === 'fixed') state.scale = 1;
    saveZoom(); applyZoom();
  }
  function saveZoom() { store.set('mode', state.mode); store.set('scale', state.scale); }

  // ---------- 화면 갱신 ----------
  function showMessage(title, detail, isError) {
    el.message.className = isError ? 'error' : '';
    el.message.replaceChildren();
    const t = document.createElement('strong'); t.textContent = title; el.message.append(t);
    if (detail) { const d = document.createElement('span'); d.textContent = detail; el.message.append(d); }
    el.message.style.display = 'flex';
  }
  const welcomeHTML = el.message.innerHTML;
  function showWelcome() { el.message.className = ''; el.message.innerHTML = welcomeHTML; el.message.style.display = 'flex'; }
  function hideMessage() { el.message.style.display = 'none'; }

  function updateZoomUI() {
    if (document.activeElement !== el.zoomInput) el.zoomInput.value = Math.round(state.current * 100) + '%';
    el.fit.classList.toggle('active', state.mode === 'fit');
    el.width.classList.toggle('active', state.mode === 'width');
    el.actual.classList.toggle('active', state.mode === 'fixed' && Math.abs(state.scale - 1) < 1e-6);
    el.pixel.classList.toggle('active', state.pixelated);
    el.img.classList.toggle('pixelated', state.pixelated);
    el.cv.classList.toggle('pixelated', state.pixelated);
    el.ec.classList.toggle('pixelated', state.pixelated);
    el.fmode.textContent = { fit: '배율 유지: 화면 맞춤', width: '배율 유지: 너비 맞춤', fixed: `배율 유지: ${Math.round(state.scale * 100)}%` }[state.mode];
  }

  function updateDicomUI() {
    const e = currentEntry();
    const isDicom = !!(e && e.dicom && view.el && view.base === el.cv);
    el.dicomGroup.hidden = !isDicom;
    if (!isDicom) { el.fwl.textContent = ''; el.frameLabel.textContent = ''; return; }
    const frames = e.dicom.frames;
    el.frameLabel.textContent = frames > 1 ? `프레임 ${state.frame + 1}/${frames}` : '';
    $('framePrevBtn').hidden = $('frameNextBtn').hidden = frames < 2;
    const gray = isGrayDicom();
    el.wl.hidden = !gray;
    el.wl.classList.toggle('active', gray && !state.wl);
    if (gray) {
      const wl = state.wl || e.frameData.defaultWL;
      el.fwl.textContent = `W/L ${Math.round(wl.w)} / ${Math.round(wl.c)} ${state.wl ? '(유지)' : '(자동)'}`;
    } else el.fwl.textContent = '';
  }

  function updateUI() {
    const n = state.entries.length, e = currentEntry();
    el.counter.textContent = n ? `${state.index + 1} / ${n}` : '0 / 0';
    el.prev.disabled = state.index <= 0;
    el.next.disabled = state.index < 0 || state.index >= n - 1;
    el.fname.textContent = e ? e.path : '—';
    el.fname.title = e ? e.path : '';
    let info = '';
    if (e) {
      const parts = [e.kind.type];
      if (e.w) parts.push(`${e.w} × ${e.h}px`);
      parts.push(formatSize(e.size));
      if (e.dicom) {
        const m = e.dicom.meta;
        if (m.modality) parts.push(m.modality);
        if (m.seriesDescription) parts.push(m.seriesDescription);
        if (m.instanceNumber) parts.push(`#${m.instanceNumber}`);
        parts.push(e.dicom.tsName);
      }
      info = parts.join(' · ');
    }
    el.finfo.textContent = info;
    document.title = e ? `${e.path.split('/').pop()} — Image Viewer` : 'Image Viewer';
    for (const btn of el.list.querySelectorAll('button.current')) btn.classList.remove('current');
    const cur = el.list.children[state.index];
    if (cur) { cur.firstChild.classList.add('current'); cur.scrollIntoView({ block: 'nearest' }); }
    updateZoomUI();
    updateDicomUI();
  }

  function renderList() {
    const frag = document.createDocumentFragment();
    state.entries.forEach((e, i) => {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.textContent = e.path;           // textContent 사용: 파일 이름으로 인한 HTML 주입 방지
      b.title = e.path;
      if (e.kind.unsupported) b.classList.add('unsupported');
      const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = e.kind.type;
      b.append(tag);
      b.addEventListener('click', () => { show(i); el.main.classList.remove('show-list-mobile'); el.viewer.focus(); });
      li.append(b); frag.append(li);
    });
    el.list.replaceChildren(frag);
  }

  function formatSize(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(1) + ' MB';
  }

  // ---------- 이벤트 ----------
  $('folderBtn').addEventListener('click', () => (SERVER_MODE ? serverPick('folder') : browserPickFolder()));
  $('fileBtn').addEventListener('click', () => (SERVER_MODE ? serverPick('file') : $('fileInput').click()));
  el.reopen.addEventListener('click', reopenFolder);
  el.recentSel.addEventListener('change', async () => {
    const dir = el.recentSel.value;
    el.recentSel.value = '';
    if (!dir) return;
    try { await openServerFolder({ dir, recursive: true }); }
    catch (err) { showMessage('열 수 없습니다', err.message, true); }
  });
  $('folderInput').addEventListener('change', (e) => { loadLocalFiles(e.target.files); e.target.value = ''; });
  $('fileInput').addEventListener('change', (e) => { loadLocalFiles(e.target.files); e.target.value = ''; });
  el.prev.addEventListener('click', () => show(state.index - 1));
  el.next.addEventListener('click', () => show(state.index + 1));
  $('zoomInBtn').addEventListener('click', () => zoomStep(1));
  $('zoomOutBtn').addEventListener('click', () => zoomStep(-1));
  el.fit.addEventListener('click', () => setMode('fit'));
  el.width.addEventListener('click', () => setMode('width'));
  el.actual.addEventListener('click', () => setMode('fixed'));
  el.pixel.addEventListener('click', () => {
    state.pixelated = !state.pixelated; store.set('pixel', state.pixelated ? 1 : 0); updateZoomUI();
    if (window.MultiView) window.MultiView.redraw();
  });
  el.listBtn.addEventListener('click', toggleList);
  $('fullBtn').addEventListener('click', toggleFull);
  $('framePrevBtn').addEventListener('click', () => changeFrame(-1));
  $('frameNextBtn').addEventListener('click', () => changeFrame(1));
  el.wl.addEventListener('click', resetWL);

  function resetWL() { state.wl = null; const e = currentEntry(); if (e && e.dicom) paintDicom(e); updateDicomUI(); }

  el.zoomInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const p = parseFloat(el.zoomInput.value);
      if (p > 0) zoomTo(p / 100);
      el.zoomInput.blur();
    } else if (e.key === 'Escape') el.zoomInput.blur();
    e.stopPropagation();
  });
  el.zoomInput.addEventListener('blur', updateZoomUI);

  function toggleList() {
    if (matchMedia('(max-width: 700px)').matches) el.main.classList.toggle('show-list-mobile');
    else el.main.classList.toggle('no-list');
    store.set('list', el.main.classList.contains('no-list') ? 0 : 1);
    requestAnimationFrame(applyZoom);
  }
  function toggleFull() {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  }

  // 휠: 확대/축소 (마우스 위치 기준)
  el.viewer.addEventListener('wheel', (e) => {
    if (!view.el) return;
    e.preventDefault();
    zoomStep(e.deltaY < 0 ? 1 : -1, e.clientX, e.clientY);
  }, { passive: false });

  // 왼쪽 드래그: 그림 이동 · 오른쪽 드래그(또는 Shift+드래그): DICOM 밝기/대비(W/L)
  let drag = null, wlFrame = 0;
  el.viewer.addEventListener('contextmenu', (e) => e.preventDefault());
  el.viewer.addEventListener('pointerdown', (e) => {
    if (!view.el) return;
    if (e.target === el.textInput) return;
    if (Editor.pointerDown(e)) return;          // 편집 도구가 처리
    const wantWL = (e.button === 2 || (e.button === 0 && e.shiftKey)) && isGrayDicom();
    if (!wantWL && e.button !== 0) return;
    const cur = currentEntry();
    drag = wantWL
      ? { wl: true, x: e.clientX, y: e.clientY, start: { ...(state.wl || cur.frameData.defaultWL) }, range: Math.max(1, cur.frameData.max - cur.frameData.min) }
      : { x: e.clientX, y: e.clientY, sl: el.viewer.scrollLeft, st: el.viewer.scrollTop };
    try { el.viewer.setPointerCapture(e.pointerId); } catch { /* 캡처 불가 시에도 드래그는 동작 */ }
    el.viewer.classList.add(wantWL ? 'wl-drag' : 'dragging');
  });
  el.viewer.addEventListener('pointermove', (e) => {
    if (Editor.pointerMove(e)) return;
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (drag.wl) {
      const k = drag.range / 400;       // 영상 값 범위에 맞춘 감도
      state.wl = { w: Math.max(1, drag.start.w + dx * k), c: drag.start.c + dy * k };
      if (!wlFrame) wlFrame = requestAnimationFrame(() => { wlFrame = 0; paintDicom(currentEntry()); });
    } else {
      el.viewer.scrollLeft = drag.sl - dx;
      el.viewer.scrollTop = drag.st - dy;
    }
  });
  const endDrag = () => { drag = null; el.viewer.classList.remove('dragging', 'wl-drag'); };
  el.viewer.addEventListener('pointerup', (e) => { if (!Editor.pointerUp(e)) endDrag(); });
  el.viewer.addEventListener('pointercancel', (e) => { Editor.pointerUp(e); endDrag(); });
  el.viewer.addEventListener('dblclick', (e) => {
    if (Editor.dblClick(e)) return;
    setMode(state.mode === 'fit' ? 'fixed' : 'fit');
  });

  // 끌어다 놓기 (업로드 없이 브라우저가 직접 읽음)
  ['dragenter', 'dragover'].forEach((t) => el.viewer.addEventListener(t, (e) => { e.preventDefault(); el.viewer.classList.add('drop-hover'); }));
  ['dragleave', 'drop'].forEach((t) => el.viewer.addEventListener(t, () => el.viewer.classList.remove('drop-hover')));
  el.viewer.addEventListener('drop', async (e) => { e.preventDefault(); loadLocalFiles(await filesFromDrop(e.dataTransfer)); });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => e.preventDefault());

  // 키보드
  document.addEventListener('keydown', (e) => {
    if (e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement) return;
    const k = e.key;
    if (k === 'm' || k === 'M') { toggleMulti(); e.preventDefault(); return; }
    if (k === 'f' || k === 'F') { toggleFull(); e.preventDefault(); return; }
    // 편집 단축키는 단일·다중 화면 모두에서 먼저 처리
    if ((k === 'e' || k === 'E') && !e.ctrlKey) { Editor.toggle(); e.preventDefault(); e.stopImmediatePropagation(); return; }
    if (Editor.key(e)) { e.preventDefault(); e.stopImmediatePropagation(); return; }
    if (window.MultiView && window.MultiView.active) return;  // 다중 화면은 multiview.js가 키를 처리
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') show(state.index + 1);
    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') show(state.index - 1);
    else if (k === 'ArrowDown') changeFrame(1);
    else if (k === 'ArrowUp') changeFrame(-1);
    else if (k === 'Home') show(0);
    else if (k === 'End') show(state.entries.length - 1);
    else if (k === '+' || k === '=') zoomStep(1);
    else if (k === '-' || k === '_') zoomStep(-1);
    else if (k === '0') setMode('fit');
    else if (k === '1') setMode('fixed');
    else if (k === 'w' || k === 'W') setMode('width');
    else if (k === 'a' || k === 'A') resetWL();
    else if (k === 'p' || k === 'P') el.pixel.click();
    else if (k === 'l' || k === 'L') toggleList();
    else if (k === 'f' || k === 'F') toggleFull();
    else return;
    e.preventDefault();
  });

  new ResizeObserver(() => { if (state.mode !== 'fixed') applyZoom(); }).observe(el.viewer);
  window.addEventListener('pagehide', releaseAll);

  // ---------- 다중 화면 연결 ----------
  async function readBlob(entry, max) {
    if (entry.source === 'local') return max ? entry.file.slice(0, max) : entry.file;
    if (!max && entry.blob) return entry.blob;
    return api('/api/file', { dir: entry.dir, rel: entry.rel, max: max || null });
  }
  if (window.MultiView) {
    window.MultiView.init({
      entries: () => state.entries,
      readBlob,
      parseDicom,
      async displayBlob(entry) {
        const b = await readBlob(entry);
        return entry.kind.decoder === 'tiff' ? tiffToBlob(b) : b.slice(0, b.size, entry.kind.mime);
      },
      pixelated: () => state.pixelated,
      collator,
      // 편집 기능 연결 (선택한 창의 그림에 편집)
      edit: {
        active: () => Editor.active,
        paint: (...a) => Editor.paint(...a),
        down: (e, cap) => Editor.pointerDown(e, cap),
        move: (e) => Editor.pointerMove(e),
        up: (e) => Editor.pointerUp(e),
        dbl: (e) => Editor.dblClick(e),
        targetChanged: () => { Editor.resetTransient(); Editor.updateUIState(); },
      },
    });
  }
  function toggleMulti() {
    if (!window.MultiView) return;
    const on = !window.MultiView.active;
    Editor.resetTransient();   // 편집 대상이 단일 화면 ↔ 선택한 창으로 바뀜
    el.main.classList.toggle('multi', on);
    document.body.classList.toggle('multi-mode', on);
    $('multiBtn').classList.toggle('active', on);
    if (on) window.MultiView.open().then(() => Editor.updateUIState());
    else { window.MultiView.close(); refreshView(); requestAnimationFrame(applyZoom); Editor.updateUIState(); }
  }
  $('multiBtn').addEventListener('click', toggleMulti);

  // ---------- 편집: 영역 지우기 · 도형 · 글자 ----------
  // 편집 내용은 그림(DICOM은 프레임)마다 따로 메모리에 보관합니다. 원본 파일은 바꾸지 않고,
  // "PNG로 저장"을 누르면 편집 결과를 새 파일로 내려받습니다.
  // 좌표·굵기·글자 크기는 모두 그림의 원래 픽셀 단위로 저장합니다.
  const Editor = (() => {
    const $e = (id) => document.getElementById(id);
    const ui = {

      if (!ctrl && (k === 'v' || k === 'V')) { setTool('select'); return true; }
      return false;
    }
    function deleteSel() {
      const o = st.sel;
      if (!o) return;
      st.sel = null;
      commit((ops) => { const i = ops.indexOf(o); if (i >= 0) ops.splice(i, 1); });
    }

    ui.btn.addEventListener('click', () => toggle());
    ui.tools.forEach((b) => b.addEventListener('click', () => setTool(b.dataset.tool)));
    $e('eraseIn').addEventListener('click', () => applyErase('inside'));
    $e('eraseOut').addEventListener('click', () => applyErase('outside'));
    $e('eraseCancel').addEventListener('click', () => { st.region = null; rerender(); updateUIState(); });
    ui.warpApply.addEventListener('click', applyWarp);
    ui.warpCancel.addEventListener('click', () => { st.warp = null; rerender(); updateUIState(); });
    ui.undo.addEventListener('click', undo);
    ui.redo.addEventListener('click', redo);
    ui.del.addEventListener('click', deleteSel);
    ui.clear.addEventListener('click', () => { st.sel = null; st.region = null; st.warp = null; commit((ops, ed) => { ops.length = 0; ed.rot = 0; }); });
    ui.save.addEventListener('click', save);
    window.addEventListener('beforeunload', (e) => { if (unsavedCount()) { e.preventDefault(); e.returnValue = ''; } });
    updateUIState();

    return {
      get active() { return st.active; },
      hasOpsSingle, renderSingle, paint, unsavedCount, toggle, resetTransient, key, updateUIState,
      pointerDown, pointerMove, pointerUp, dblClick,
    };
  })();

  // ---------- 시작 ----------
  if (store.get('list', '1') === '0') el.main.classList.add('no-list');
  el.fsafe.textContent = SERVER_MODE ? '🔒 내 컴퓨터에서 직접 읽는 중 · 업로드 없음' : '🔒 브라우저 안에서만 읽음 · 업로드 없음';
  if (SERVER_MODE) {
    api('/api/start').then((r) => {
      refreshRecent(r.recent || []);
      if (r.target) openServerFolder(r.target).catch((err) => showMessage('열 수 없습니다', err.message, true));
    }).catch(() => {});
  } else if (canPickDir) {
    loadLastDir().then((d) => { if (d) { el.reopen.hidden = false; el.reopen.title = `"${d.name}" 폴더 다시 열기`; } });
  }
  updateUI();
})();
</script>
</body>
</html>
